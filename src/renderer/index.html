<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
  <title>Rev AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="island" class="island collapsed">
    <!-- collapsed: a pill around the notch; peek: a short notification; expanded: the whole app -->
    <button id="pill" class="pill" title="Open Rev (⌘⇧Space)">
      <span class="pill-left"><svg class="logo" viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></span>
      <span class="pill-gap"></span>
      <span class="pill-right" id="pillRight"></span>
    </button>
    <button id="peek" class="peek">
      <span class="note-icon" id="peekIcon"></span>
      <span class="peek-text">
        <span class="peek-top" id="peekTop"></span>
        <span class="peek-title" id="peekTitle"></span>
      </span>
    </button>
  <main id="panel" class="panel">
    <header class="titlebar">
      <button id="hideBtn" class="hidden" title="Close"></button>
      <div class="repo" id="repoWrap">
        <button id="repoBtn" class="repo-btn" title="Choose repository">Choose Repository</button>
        <div id="repoStatus" class="repo-status"></div>
        <div id="repoMenu" class="menu hidden"></div>
      </div>
      <button id="newChat" class="icon-btn" title="New conversation">
        <svg viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button id="pinBtn" class="icon-btn" title="Keep open">
        <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v1H7v-1l3-3z"/><path d="M12 14v6"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <nav class="segmented" role="tablist">
      <button class="tab active" data-tab="chat" role="tab">Chat</button>
      <button class="tab" data-tab="prs" role="tab">PRs</button>
      <button class="tab" data-tab="inbox" role="tab">Inbox <span id="inboxBadge" class="count hidden"></span></button>
    </nav>

    <section id="chat" class="view">
      <div id="log" class="log">
        <div class="hint">
          <div class="hint-mark"><svg class="logo" viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></div>
          <div class="hint-title">What should I do?</div>
          <div class="hint-sub">Risky commands wait for your OK.</div>
          <div class="chips">
            <button class="chip" data-prompt="What's the status of this repo?">Status</button>
            <button class="chip" data-prompt="Pull the latest changes">Pull latest</button>
            <button class="chip" data-prompt="Commit my changes with a good message and push">Commit and push</button>
          </div>
        </div>
      </div>
      <form id="composer" class="composer">
        <div class="field">
          <textarea id="input" rows="1" placeholder="Message Rev" autocomplete="off"></textarea>
          <button type="button" id="stopBtn" class="round stop hidden" title="Stop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
          <button type="submit" id="sendBtn" class="round send" title="Send (↩)"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        </div>
      </form>
    </section>

    <section id="prs" class="view hidden">
      <div class="prs-toolbar">
        <button id="prRefresh" class="btn">Refresh</button>
        <button id="prNewToggle" class="btn">＋ New PR</button>
      </div>
      <form id="prForm" class="group pr-form hidden">
        <input id="prTitle" class="row-input" placeholder="Title" required />
        <textarea id="prBody" class="row-input" rows="3" placeholder="Description"></textarea>
        <input id="prBase" class="row-input" placeholder="Base branch (repository default)" />
        <label class="row-input switch-row">Draft
          <span class="switch"><input type="checkbox" id="prDraft" /><span></span></span>
        </label>
        <div class="form-foot">
          <span class="small muted">Opens from your current branch.</span>
          <button type="submit" class="btn primary">Create</button>
        </div>
      </form>
      <div id="prList" class="pr-list"></div>
    </section>

    <section id="inbox" class="view hidden">
      <div class="prs-toolbar">
        <button id="inboxRefresh" class="btn">Refresh</button>
        <span class="spacer"></span>
        <button id="inboxReadAll" class="btn">Mark All Read</button>
      </div>
      <div id="inboxList" class="pr-list"></div>
    </section>

    <div id="settings" class="sheet-backdrop hidden">
      <div class="sheet">
        <h3 class="sheet-brand"><span class="brand-mark"><svg class="logo" viewBox="0 0 24 24"><path d="M12 2.5 21.5 12 12 21.5 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></span>Rev AI</h3>
        <div class="group" id="claudeGroup">
          <label class="row-input switch-row last">Use my Claude plan
            <span class="switch"><input type="checkbox" id="claudeToggle" /><span></span></span>
          </label>
        </div>
        <div id="claudeNote" class="small muted note"></div>
        <div class="group" id="keyGroup">
          <label class="row-input stack" for="apiKey">
            <span class="small muted">API Key (Groq, OpenRouter or Anthropic)</span>
            <input id="apiKey" type="password" placeholder="gsk_…, sk-or-… or sk-ant-…" autocomplete="off" />
          </label>
        </div>
        <div id="keyNote" class="small muted note"></div>
        <div class="group">
          <label class="row-input switch-row">GitHub notifications
            <span class="switch"><input type="checkbox" id="notifyToggle" /><span></span></span>
          </label>
          <label class="row-input switch-row last">Keep island open
            <span class="switch"><input type="checkbox" id="pinToggle" /><span></span></span>
          </label>
        </div>
        <p class="small muted" id="about"></p>
        <div class="sheet-foot">
          <button id="quitBtn" class="btn destructive">Quit Rev</button>
          <span class="spacer"></span>
          <button id="closeSettings" class="btn">Cancel</button>
          <button id="saveKey" class="btn primary">Save</button>
        </div>
      </div>
    </div>
  </main>
    <div id="resizeGrip" class="resize-grip" title="Drag to resize · double-click to reset"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
